project_id = "lightspeed-scorekeeper"

[auth]
enable_signup = false
minimum_password_length = 6

[auth.email]
enable_signup = false

# Normal Supabase mail delivery uses configured SMTP. The old blocking hook
# is disabled only after provider setup and delivery verification.
[auth.hook.send_email]
enabled = false
uri = "pg-functions://postgres/public/scorekeeper_block_email"

[functions.manage-users]
verify_jwt = true

[functions.image-assets]
verify_jwt = true
static_files = ["./functions/image-assets/vendor/webp_dec.wasm"]
